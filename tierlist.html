<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorian Electra - Make Your Own Tier List</title>
    <link rel="stylesheet" href="webstyle.css">
</head>
<body>

    <header>
        <h1>Dorian Electra Song Tier List Ranking</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="discography.html">Discography & Eras</a></li>
            <li><a href="visuals.html">Visual Aesthetics & Themes</a></li>
            <li><a href="tierlist.html">Make Your Own Tier List</a></li>
        </ul>
    </nav>

    <main class="tier-list-container">
        <!-- The tier-list rows -->
        <div class="tier-row" data-tier="s">
            <div class="tier-label" style="background-color: #ff6dbd;">S</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>

        <div class="tier-row" data-tier="a">
            <div class="tier-label" style="background-color: #ff7acc;">A</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>

        <div class="tier-row" data-tier="b">
            <div class="tier-label" style="background-color: #ff86e5;">B</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>

        <div class="tier-row" data-tier="c">
            <div class="tier-label" style="background-color: #f583ff;">C</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>

        <div class="tier-row" data-tier="d">
            <div class="tier-label" style="background-color: #d57aff;">D</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>

        <div class="tier-row" data-tier="f">
            <div class="tier-label" style="background-color: #a97bff;">F</div>
            <div class="tier-dropzone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>

        <!-- Where unranked songs are stored until they're dragged out -->
        <div class="song-pool-container">
            <h3>Unranked Songs</h3>
            <div class="song-pool">
                <!-- JavaScript code adds songs to this container -->
            </div>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
